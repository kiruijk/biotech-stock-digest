name: Update Stock Data Daily

# No push trigger: code/content pushes already include locally rendered pages, and a
# push-triggered run would race with them. Use "Run workflow" for an immediate refresh.
on:
  schedule:
    # Run daily at 4:15 PM ET (8:15 PM UTC) on weekdays
    - cron: "15 20 * * MON-FRI"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run stock update script
        run: node update-stocks.js

      - name: Commit and push changes
        run: |
          git config --local user.name "Stock Bot"
          git config --local user.email "bot@github.com"
          git add index.html calendar.html stocks/ themes/ data/market.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Update stock prices and news - $(date +'%Y-%m-%d %H:%M:%S')"
            git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
          fi

      # Posts the editorial to-do list (past catalysts, overdue reviews, big moves) to the
      # run's summary page; never fails the run
      - name: Editorial review queue
        run: node review-queue.js

      # Runs after the commit so good data is still saved; a failure here turns the run
      # red and triggers GitHub's failed-workflow email
      - name: Check data freshness
        run: node check-freshness.js
